name: Gallery

on:
  push:
    branches: [main]
  workflow_dispatch:

permissions:
  contents: read
  pages: write
  id-token: write

concurrency:
  group: pages
  cancel-in-progress: true

jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-node@v4
        with:
          node-version: 20

      - name: Install rsvg-convert and Korean fonts
        run: |
          sudo apt-get update -qq
          sudo apt-get install -y -qq --no-install-recommends librsvg2-bin fonts-noto-cjk fonts-nanum
          fc-cache -f

      - name: Install skill dependencies
        run: npm ci --prefix skills/mega-hwp

      - name: Test
        run: node tests/test.mjs

      - name: Build gallery
        run: node gallery/build.mjs site

      - name: Skill zip (Claude 앱 Chat 업로드용, 엔진 포함)
        run: |
          rm -rf /tmp/zip && mkdir -p /tmp/zip && cp -R skills/mega-hwp /tmp/zip/ && cd /tmp/zip/mega-hwp
          mkdir -p vendor/rhwp-core vendor/fflate && cp node_modules/@rhwp/core/rhwp.js node_modules/@rhwp/core/rhwp_bg.wasm node_modules/@rhwp/core/LICENSE vendor/rhwp-core/
          cp node_modules/fflate/esm/index.mjs node_modules/fflate/LICENSE vendor/fflate/ && rm -rf node_modules
          cd .. && zip -qr "$GITHUB_WORKSPACE/site/mega-hwp-skill.zip" mega-hwp -x '*.DS_Store'

      - uses: actions/configure-pages@v5

      - uses: actions/upload-pages-artifact@v3
        with:
          path: site

  deploy:
    needs: build
    runs-on: ubuntu-latest
    environment:
      name: github-pages
      url: ${{ steps.deployment.outputs.page_url }}
    steps:
      - id: deployment
        uses: actions/deploy-pages@v4
